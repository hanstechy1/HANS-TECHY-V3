<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HANS TECHY V2 - Pairing Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 420px;
            text-align: center;
            animation: fadeIn 1.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            margin-bottom: 10px;
            font-size: 24px;
            color: #00ff88;
            letter-spacing: 1px;
        }

        p {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: #00ff88;
            color: #0f0c29;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
        }

        input:focus {
            border-color: #00ff88;
        }

        button.action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            background: #00ff88;
            color: #0f0c29;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button.action-btn:hover {
            background: #00cc6a;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }

        .result-box {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 8px;
            display: none;
            align-items: center;
            justify-content: space-between;
        }

        .result-box span {
            font-size: 18px;
            font-weight: bold;
            color: #00ff88;
            letter-spacing: 2px;
        }

        .copy-btn {
            background: #00ff88;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #0f0c29;
        }

        .copy-btn:hover {
            background: #fff;
        }

        .qr-placeholder {
            margin-top: 15px;
            padding: 10px;
            background: #fff;
            border-radius: 8px;
            display: inline-block;
        }

        .music-control {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>HANS TECHY V2</h2>
        <p>Connect your WhatsApp Bot securely</p>

        <!-- Tabs for Switching -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('pair')">Pair Code</button>
            <button class="tab-btn" onclick="switchTab('qr')">QR Code</button>
        </div>

        <!-- Pair Code Section -->
        <div id="pair-section" class="section active">
            <input type="text" id="phone" placeholder="Enter phone with country code (e.g. 255686...)">
            <button class="action-btn" onclick="getPairCode()">Generate Code</button>
            
            <div class="result-box" id="resultBox">
                <span id="codeDisplay">----</span>
                <button class="copy-btn" onclick="copyCode()">Copy</button>
            </div>
        </div>

        <!-- QR Code Section -->
        <div id="qr-section" class="section">
            <div class="qr-placeholder">
                <!-- Placeholder for QR or live QR generation -->
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=HANS_TECHY_V2_SESSION" alt="QR Code">
            </div>
            <p style="margin-top: 10px; font-size: 12px;">Scan this QR code using WhatsApp linked devices.</p>
        </div>

        <div class="music-control">
            🎵 Background music playing
        </div>
    </div>

    <!-- Background Music Audio (Auto-playing link or local asset) -->
    <audio id="bgMusic" autoplay loop>
        <source src="https://www.bensound.com/bensound-music/bensound-tenderness.mp3" type="audio/mpeg">
    </audio>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));

            if (tab === 'pair') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('pair-section').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('qr-section').classList.add('active');
            }
        }

        async function getPairCode() {
            let phone = document.getElementById('phone').value;
            if (!phone) {
                alert('Please enter your phone number!');
                return;
            }

            let resultBox = document.getElementById('resultBox');
            let codeDisplay = document.getElementById('codeDisplay');
            
            codeDisplay.innerText = "Loading...";
            resultBox.style.display = "flex";

            try {
                let res = await fetch(`/pair?phone=${phone}`);
                let data = await res.json();
                if (data.status) {
                    codeDisplay.innerText = data.code;
                } else {
                    codeDisplay.innerText = "Error generating!";
                }
            } catch (e) {
                codeDisplay.innerText = "Failed!";
            }
        }

        function copyCode() {
            let codeText = document.getElementById('codeDisplay').innerText;
            navigator.clipboard.writeText(codeText);
            alert("Code copied to clipboard: " + codeText);
        }

        // Handle audio autoplay policy restrictions in some browsers
        window.addEventListener('click', () => {
            let music = document.getElementById('bgMusic');
            if (music.paused) {
                music.play();
            }
        }, { once: true });
    </script>
</body>
</html>
